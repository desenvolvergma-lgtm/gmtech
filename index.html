<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coração</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d0010; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #btn {
            z-index: 10;
            padding: 15px 30px;
            background: #ff3388;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 136, 0.6);
            transition: 0.2s;
        }
        #btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <button id="btn" onclick="startAnimation()">Clica aqui ❤️</button>
    <canvas id="heartCanvas"></canvas>
    
    <script>
        function startAnimation() {
            document.getElementById('btn').style.display = 'none';
            
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function getHeartPoint(t) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return { x: x, y: y };
            }

            const heartPoints = [];
            for (let t = 0; t < Math.PI * 2; t += 0.1) {
                heartPoints.push(getHeartPoint(t));
            }

            let textPoints = [];
            const offscreenCanvas = document.createElement('canvas');
            const offContext = offscreenCanvas.getContext('2d');
            offscreenCanvas.width = 300;
            offscreenCanvas.height = 80;
            offContext.fillStyle = '#fff';
            offContext.font = 'bold 38px sans-serif';
            offContext.textAlign = 'center';
            offContext.textBaseline = 'middle';
            offContext.fillText('TE AMO', 150, 40);
            const imageData = offContext.getImageData(0, 0, 300, 80);
            const data = imageData.data;
            
            for (let y = 0; y < 80; y += 8) {
                for (let x = 0; x < 300; x += 8) {
                    const index = (y * 300 + x) * 4;
                    if (data[index + 3] > 128) {
                        textPoints.push({ x: (x - 150) * 0.6, y: (y - 40) * 0.6 + 140 });
                    }
                }
            }

            class HeartParticle {
                constructor(target, color) {
                    this.target = target;
                    this.color = color;
                    this.speed = Math.random() * 0.08 + 0.04;
                    this.x = canvas.width / 2 + (Math.random() - 0.5) * 200;
                    this.y = canvas.height / 2 + (Math.random() - 0.5) * 200;
                    this.size = Math.random() * 1.5 + 0.8;
                }
                update() {
                    const targetX = canvas.width / 2 + this.target.x * 11;
                    const targetY = canvas.height / 2 - 30 + this.target.y * 11;
                    this.x += (targetX - this.x) * this.speed;
                    this.y += (targetY - this.y) * this.speed;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#ff3388';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const particles = [];
            heartPoints.forEach(pt => {
                for (let i = 0; i < 6; i++) {
                    particles.push(new HeartParticle({
                        x: pt.x + (Math.random() - 0.5) * 1.0,
                        y: pt.y + (Math.random() - 0.5) * 1.0
                    }, '#ff4d94'));
                }
            });

            textPoints.populando = textPoints.forEach(pt => {
                particles.push(new HeartParticle(pt, '#ff99c8'));
            });

            function animate() {
                ctx.fillStyle = 'rgba(13, 0, 16, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
